version: '3.8'

# ============================================================
# LearnovaAI Backend — Docker Compose cho môi trường Production
# Deploy lên Railway.app bằng cách push lên GitHub và kết nối repo
# ============================================================

services:
  # --- Backend FastAPI với 2 model AI baked vào image ---
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    image: learnova-ai-api:latest
    container_name: learnova_api
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - ../.env
    environment:
      # Biến môi trường bổ sung cho production
      - APP_ENV=production
      - DEBUG=false
      - WORKERS=2
      # HuggingFace cache — trỏ đến thư mục đã bake vào image
      - HF_HOME=/app/model_cache
      - TRANSFORMERS_CACHE=/app/model_cache
      - SENTENCE_TRANSFORMERS_HOME=/app/model_cache
      - HF_HUB_DISABLE_TELEMETRY=1
      - TOKENIZERS_PARALLELISM=false
    volumes:
      # Dành cho local dev: mount source code để hot-reload
      # Bỏ dòng này khi build production image thật sự
      # - ../src:/app/src
      #
      # Volume lưu trữ model cache (tùy chọn, dùng thay cho baked-in model)
      - model_cache:/app/model_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # Giới hạn tài nguyên (Railway free tier: 8GB RAM, 8 CPU)
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G

# ============================================================
# Volumes
# ============================================================
volumes:
  model_cache:
    driver: local
    # Đặt tên để tái sử dụng giữa các lần restart
    name: learnova_model_cache
