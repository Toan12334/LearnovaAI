[tool.poetry]
name = "plagiarism-ai-detector"
version = "0.1.0"
description = "Hệ thống phát hiện đạo văn, truy vết mốc thời gian và nhận diện văn bản AI"
authors = ["Learnova AI Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
qdrant-client = "^1.8.0"
sqlalchemy = "^2.0.28"
asyncpg = "^0.29.0"
redis = "^5.0.3"
httpx = "^0.27.0"
beautifulsoup4 = "^4.12.3"
python-multipart = "^0.0.9"
pypdf = "^4.1.0"
python-docx = "^1.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
black = "^24.3.0"
ruff = "^0.3.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
