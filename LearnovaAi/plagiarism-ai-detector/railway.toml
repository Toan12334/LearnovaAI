# ==================================================================
# railway.toml — Cấu hình deploy lên Railway.app
# File này nằm trong: LearnovaAi/plagiarism-ai-detector/railway.toml
#
# QUAN TRỌNG: Trên Railway Dashboard, đặt Root Directory = LearnovaAi/plagiarism-ai-detector
# ==================================================================

[build]
# Dùng Dockerfile tùy chỉnh (chứa logic preload 2 model AI lúc build)
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile"

[deploy]
# Railway inject $PORT tự động — không hardcode port ở đây
# uvicorn sẽ bind vào $PORT từ environment
healthcheckPath = "/health"
healthcheckTimeout = 300

# Restart policy
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
