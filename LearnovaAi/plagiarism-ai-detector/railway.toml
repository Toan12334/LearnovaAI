# ==================================================================
# railway.toml — Cấu hình deploy lên Railway.app
# File này nằm trong: LearnovaAi/plagiarism-ai-detector/railway.toml
#
# QUAN TRỌNG: Trên Railway Dashboard, đặt Root Directory = LearnovaAi/plagiarism-ai-detector
# ==================================================================

[build]
# Dùng Dockerfile tùy chỉnh (chứa logic preload 2 model AI lúc build)
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile"

[deploy]
# Lệnh khởi động — Railway inject $PORT tự động
startCommand = "uvicorn src.main:app --host 0.0.0.0 --port $PORT --workers 2"

# Health check — Railway dùng để biết app đã sẵn sàng nhận traffic
healthcheckPath = "/health"
healthcheckTimeout = 300

# Restart policy
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
