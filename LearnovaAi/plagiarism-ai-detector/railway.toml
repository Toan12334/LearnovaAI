# ==================================================================
# railway.toml — Cấu hình deploy lên Railway.app
# Đặt Root Directory = LearnovaAi/plagiarism-ai-detector trong Railway Dashboard
# ==================================================================

[build]
# Dùng Dockerfile tùy chỉnh (chứa logic preload 2 model AI lúc build)
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile"

[deploy]
# Railway inject $PORT tự động lúc runtime
startCommand = "uvicorn src.main:app --host 0.0.0.0 --port $PORT --workers 1 --log-level info"
healthcheckPath = "/health"
healthcheckTimeout = 300
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
